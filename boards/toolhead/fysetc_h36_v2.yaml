# Fysetc H36 v2.0 — reference: canbus.esoterical.online (Common Toolhead Hardware)
# NOTE: CAN mode requires "GPIO pins to set at micro-controller startup" = !PA2
# in BOTH Katapult and Klipper — add the correct symbol after verifying in the guide.
name: "Fysetc H36 v2.0"
category: toolhead
mcu: STM32F072
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Connect USB, hold BOOT0, tap RESET, count 5 and release BOOT0"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: permanent
  warnings:
    - "CAN mode requires the !PA2 startup GPIO in Katapult and Klipper"
    - "120R enabled from factory — cut pads to disable"
