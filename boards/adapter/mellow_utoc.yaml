# Mellow Fly UTOC-1 / UTOC-3 — USB-CAN adapter (does not run Katapult/Klipper)
# Reference: canbus.esoterical.online (Common CAN Adapters)
# Factory firmware comes pre-installed; this profile restores the OEM image.
name: "Mellow Fly UTOC-1/UTOC-3"
category: adapter
mcu: STM32/APM32
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"    # STM32 variant
    - "314b:0106"    # Geehy APM32 variant
  instructions: "Set the DFU jumper and connect USB (lsusb shows 0483:df11 OR 314b:0106)"
adapter:
  firmware: "https://mellow-3d.github.io/files/utoc_firmware.bin"
  command: "dfu-util -d {vidpid} -c 1 -i 0 -a 0 -s 0x08000000 -D {file}"
hardware:
  resistor_120r: permanent
  warnings:
    - "Factory firmware comes pre-installed — only use for restoration"
