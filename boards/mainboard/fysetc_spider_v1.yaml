# Fysetc Spider v1.0 — reference: canbus.esoterical.online (Common Mainboard Hardware)
# NOTE: requires an external CAN transceiver (TJA1050) wired to PD0/PD1
name: "Fysetc Spider v1.0"
category: mainboard
mcu: STM32F446
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "VERIFY in the guide: Spider v1.0 DFU sequence"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F446=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_FLASH_START_8000=y"
    - "CONFIG_STM32_APP_START_8000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PD0_PD1=y"   # VERIFY pins (PD0/PD1)
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F446=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_FLASH_START_8000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PD0_PD1=y"   # VERIFY pins (PD0/PD1)
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: external
  warnings:
    - "Requires an external CAN transceiver (TJA1050) on PD0/PD1 — no CAN without it"
    - "The 120R resistor lives on the transceiver, not on the board"
