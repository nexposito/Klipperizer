# Fysetc Spider v3.0 H7 — reference: canbus.esoterical.online (Common Mainboard Hardware)
name: "Fysetc Spider v3.0 H7"
category: mainboard
mcu: STM32H743
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Hold BT0, tap RST, count 5 and release BT0"
# H743: 128KiB Katapult offset, 25 MHz crystal (VERIFY) and FDCAN pins (VERIFY)
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32H743=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_CLOCK_REF_25M=y"   # VERIFY crystal
    - "CONFIG_STM32_FLASH_START_20000=y"
    - "CONFIG_STM32_APP_START_20000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB5_PB6=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32H743=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_CLOCK_REF_25M=y"   # VERIFY crystal
    - "CONFIG_STM32_FLASH_START_20000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB5_PB6=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: permanent
  warnings:
    - "CAN port on JST-XH connector"
    - "VERIFY MCU, clock, offset and pins against the guide before the first flash"
