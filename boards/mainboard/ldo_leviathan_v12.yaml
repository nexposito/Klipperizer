# LDO Leviathan v1.2 — reference: canbus.esoterical.online (Common Mainboard Hardware)
# VERIFY: MCU, boot method, offset and pins on the board page in the guide
name: "LDO Leviathan v1.2"
category: mainboard
mcu: STM32H723
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "VERIFY in the guide: Leviathan v1.2 DFU sequence"
# H723: 128KiB Katapult offset, 25 MHz crystal (VERIFY) and FDCAN pins (VERIFY)
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32H723=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_CLOCK_REF_25M=y"   # VERIFY crystal
    - "CONFIG_STM32_FLASH_START_20000=y"
    - "CONFIG_STM32_APP_START_20000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB5_PB6=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32H723=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_CLOCK_REF_25M=y"   # VERIFY crystal
    - "CONFIG_STM32_FLASH_START_20000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB5_PB6=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: jumper
  warnings:
    - "Default-generated profile — VERIFY MCU, clock, offset and pins on the board page"
