# BTT MMB CAN v1.0/v1.1 — reference: canbus.esoterical.online (Common Toolhead Hardware)
name: "BTT MMB CAN v1.0/v1.1"
category: toolhead
mcu: STM32G0B1
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Set the 5V jumper, connect USB, hold Reset and BOOT, release Reset then BOOT (lsusb must show 0483:df11)"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: jumper
  warnings:
    - "5V jumper required to power the board via USB in DFU mode"
