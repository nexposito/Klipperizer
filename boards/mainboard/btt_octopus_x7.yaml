# BTT Octopus X7 (Troodon) — referência: canbus.esoterical.online (Common Mainboard Hardware)
nome: "BTT Octopus X7 (Troodon)"
categoria: mainboard
mcu: STM32F446
bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"
  instrucoes: "Segure BOOT, toque RESET, conte 5 e solte BOOT"
katapult:
  comum:
    - "CONFIG_MCU_STM32F446=y"
    - "CONFIG_CLOCK_FREQ_180M=y"
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
    - "CONFIG_USB_IDS=1d50:6177"             # VALIDAR
klipper:
  comum:
    - "CONFIG_MCU_STM32F446=y"
    - "CONFIG_CLOCK_FREQ_180M=y"
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
hardware:
  resistor_120r: permanente
  avisos:
    - "Confirme MCU, offset e pinos no guia antes do primeiro flash"
