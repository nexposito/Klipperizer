# ============================================================
#  Klipperizer — Board profile template
#  Copy to boards/<category>/<board>.yaml and fill in.
#  Categories: toolhead | mainboard | filament_changer |
#              inductive_probe | expansion_board | adapter
#  Symbols verified against the official Kconfigs (Oct 2026):
#    Klipper:  github.com/Klipper3d/klipper → src/<family>/Kconfig
#    Katapult: github.com/Arksine/katapult → src/<family>/Kconfig
# ============================================================

name: "Board Name vX.Y"
category: toolhead               # toolhead | mainboard | filament_changer | inductive_probe | expansion_board | adapter
mcu: STM32G0B1                   # the board's real chip

bootloader:
  method: dfu                    # dfu | bootsel
  vid_pid:
    - "0483:df11"
  instructions: "Exact steps to enter DFU/BOOT mode"

# ---- STM32 symbol patterns (Klipper and Katapult share the names) ----
#   Architecture + model: CONFIG_MACH_STM32=y + CONFIG_MACH_<MODEL>=y
#   CAN:  CONFIG_STM32_CANBUS_PA11_PA12=y   (alternatives: PB8_PB9, PD0_PD1*)
#   USB:  CONFIG_STM32_USB_PA11_PA12=y
#   (*PD0_PD1, PB0_PB1 and other pinouts require CONFIG_LOW_LEVEL_OPTIONS=y
#    and the STM32_MMENU_CANBUS_* symbol)
#   8KiB Katapult offset:  CONFIG_STM32_FLASH_START_2000=y
#                          + CONFIG_STM32_APP_START_2000=y (Katapult only)
#   32KiB (F4): ..._8000   |   128KiB (H7): ..._20000
#   Clock Reference: hidden by default (8 MHz crystal assumed). For other
#     crystals (e.g. 25 MHz on H7) add CONFIG_LOW_LEVEL_OPTIONS=y
#     + CONFIG_STM32_CLOCK_REF_25M=y.
#
# ---- RP2040/RP2350 patterns ----
#   Architecture: CONFIG_MACH_RPXXXX=y + CONFIG_MACH_RP2040=y
#   CAN: CONFIG_RPXXXX_CANBUS=y + CONFIG_RPXXXX_CANBUS_GPIO_RX=<n>
#        + CONFIG_RPXXXX_CANBUS_GPIO_TX=<n>   (GPIO numbers, not pairs!)
#   USB: CONFIG_RPXXXX_USB=y
#   Katapult/Klipper offset: CONFIG_RPXXXX_FLASH_START_4000=y (16KiB)

katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins against the guide
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"

klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins against the guide
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"

hardware:
  resistor_120r: jumper           # permanent | jumper | none | external
  warnings: []                    # shown before flashing
