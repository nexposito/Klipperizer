# BTT Octopus (STM32F446) — reference: canbus.esoterical.online (Common Mainboard Hardware)
# NOTE: the Octopus exists in 4 MCU variants (F446, F429, F407, H723).
# Check your board's chip before flashing.
name: "BTT Octopus (STM32F446)"
category: mainboard
mcu: STM32F446
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Set the BOOT jumper and press the RESET button (the board can be powered by 24V or the USB power jumper)"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F446=y"
    - "CONFIG_STM32_FLASH_START_8000=y"
    - "CONFIG_STM32_APP_START_8000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # CAN port on RJ12 (v1/v1.1)
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F446=y"
    - "CONFIG_STM32_FLASH_START_8000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: permanent
  warnings:
    - "The Octopus has 4 MCU variants — check the chip before flashing"
