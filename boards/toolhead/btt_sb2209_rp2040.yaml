# BTT SB2209 (RP2040) — referência: canbus.esoterical.online (Common Toolhead Hardware)
nome: "BTT SB2209 (RP2040)"
categoria: toolhead
mcu: RP2040

bootloader:
  metodo: bootsel
  vid_pid:
    - "2e8a:0003"
  instrucoes: "Coloque o jumper 5V, segure o botão BOOT e conecte o USB (lsusb deve mostrar 2e8a:0003 - Pi RP2 Boot)"

katapult:
  comum:
    - "CONFIG_MCU_RP2040=y"
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_GPIO25_GPIO26=y"       # VALIDAR: pinos CAN do SB2209
  usb:
    - "CONFIG_USB=y"
    - "CONFIG_USB_IDS=1d50:6177"             # VALIDAR: símbolo do Katapult

klipper:
  comum:
    - "CONFIG_MCU_RP2040=y"
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_GPIO25_GPIO26=y"       # VALIDAR: pinos CAN do SB2209
  usb:
    - "CONFIG_USB=y"

hardware:
  resistor_120r: jumper
  avisos:
    - "Jumper 5V necessário para alimentar via USB no modo BOOTSEL"
