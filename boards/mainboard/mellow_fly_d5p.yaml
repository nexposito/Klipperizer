# Mellow FLY-D5P — referência: canbus.esoterical.online (Common Mainboard Hardware)
# VALIDAR: MCU, modo de boot, offset e pinos na página da placa no guia
nome: "Mellow FLY-D5P"
categoria: mainboard
mcu: STM32H723
bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"
  instrucoes: "VALIDAR no guia: sequência de DFU da FLY-D5P"
katapult:
  comum:
    - "CONFIG_MCU_STM32H723=y"
    - "CONFIG_CLOCK_FREQ_550M=y"             # VALIDAR: clock no guia
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
    - "CONFIG_USB_IDS=1d50:6177"             # VALIDAR
klipper:
  comum:
    - "CONFIG_MCU_STM32H723=y"
    - "CONFIG_CLOCK_FREQ_550M=y"             # VALIDAR: clock no guia
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
hardware:
  resistor_120r: jumper
  avisos:
    - "Perfil gerado por padrão — valide MCU, clock, offset e pinos na página da placa"
