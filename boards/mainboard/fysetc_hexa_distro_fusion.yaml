# Fysetc Hexa Distro Fusion — reference: canbus.esoterical.online (Common Mainboard Hardware)
name: "Fysetc Hexa Distro Fusion"
category: mainboard
mcu: STM32H723
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Hold BOOT, tap RESET and release BOOT"
# H723: 128KiB Katapult offset, 25 MHz crystal (VERIFY) and FDCAN pins (VERIFY)
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32H723=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_CLOCK_REF_25M=y"   # VERIFY crystal
    - "CONFIG_STM32_FLASH_START_20000=y"
    - "CONFIG_STM32_APP_START_20000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB5_PB6=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32H723=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_CLOCK_REF_25M=y"   # VERIFY crystal
    - "CONFIG_STM32_FLASH_START_20000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB5_PB6=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: permanent
  warnings:
    - "6 CAN ports on JST-XH connectors"
    - "To remove the 120R from the circuit, cut the JP1 trace"
    - "VERIFY MCU, clock, offset and pins against the guide before the first flash"
