# BTT U2C v2.1 — adaptador USB-CAN (não roda Katapult/Klipper)
# Referência: canbus.esoterical.online (Common CAN Adapters)
nome: "BTT U2C v2.1"
categoria: adaptador
mcu: STM32G0B1

bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"
  instrucoes: "Segure o botão BOOT enquanto conecta o cabo USB"

adaptador:
  firmware: "https://github.com/Esoterical/voron_canbus/raw/main/can_adapter/BigTreeTech%20U2C%20v2.1/G0B1_U2C_V2.bin"
  comando: "dfu-util -d {vidpid} -a 0 -s 0x08000000:leave -D {arquivo}"

hardware:
  resistor_120r: jumper
  avisos:
    - "Exige o driver gs_usb no kernel (lsmod | grep can)"
    - "Lotes antigos vieram com firmware defeituoso — a gravação do binário corrigido resolve"
