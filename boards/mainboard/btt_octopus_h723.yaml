# BTT Octopus (STM32H723) — reference: canbus.esoterical.online (Common Mainboard Hardware)
name: "BTT Octopus (STM32H723)"
category: mainboard
mcu: STM32H723
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Set the BOOT jumper and press the RESET button (the board can be powered by 24V or the USB power jumper)"
# H723: 128KiB Katapult offset, 25 MHz crystal (VERIFY) and FDCAN pins (VERIFY)
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32H723=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_CLOCK_REF_25M=y"   # VERIFY crystal
    - "CONFIG_STM32_FLASH_START_20000=y"
    - "CONFIG_STM32_APP_START_20000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB5_PB6=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32H723=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_CLOCK_REF_25M=y"   # VERIFY crystal
    - "CONFIG_STM32_FLASH_START_20000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB5_PB6=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: permanent
  warnings:
    - "The Octopus has 4 MCU variants — check the chip before flashing"
