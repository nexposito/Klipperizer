# BTT SB2209 (RP2040) — reference: canbus.esoterical.online (Common Toolhead Hardware)
name: "BTT SB2209 (RP2040)"
category: toolhead
mcu: RP2040
bootloader:
  method: bootsel
  vid_pid:
    - "2e8a:0003"
  instructions: "Set the 5V jumper, hold the BOOT button and connect the USB cable (lsusb must show 2e8a:0003 - Pi RP2 Boot)"
katapult:
  common:
    - "CONFIG_MACH_RPXXXX=y"
    - "CONFIG_MACH_RP2040=y"
    - "CONFIG_RPXXXX_FLASH_START_4000=y"
  can:
    - "CONFIG_RPXXXX_CANBUS=y"
    - "CONFIG_RPXXXX_CANBUS_GPIO_RX=25"   # VERIFY pins
    - "CONFIG_RPXXXX_CANBUS_GPIO_TX=26"   # VERIFY pins
  usb:
    - "CONFIG_RPXXXX_USB=y"
klipper:
  common:
    - "CONFIG_MACH_RPXXXX=y"
    - "CONFIG_MACH_RP2040=y"
    - "CONFIG_RPXXXX_FLASH_START_4000=y"
  can:
    - "CONFIG_RPXXXX_CANBUS=y"
    - "CONFIG_RPXXXX_CANBUS_GPIO_RX=25"   # VERIFY pins
    - "CONFIG_RPXXXX_CANBUS_GPIO_TX=26"   # VERIFY pins
  usb:
    - "CONFIG_RPXXXX_USB=y"
hardware:
  resistor_120r: jumper
  warnings:
    - "5V jumper required to power via USB in BOOTSEL mode"
