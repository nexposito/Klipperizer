# BTT Octopus (STM32F407) — referência: canbus.esoterical.online (Common Mainboard Hardware)
nome: "BTT Octopus (STM32F407)"
categoria: mainboard
mcu: STM32F407
bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"
  instrucoes: "Coloque o jumper BOOT e pressione o botão RESET (a placa pode estar alimentada por 24V ou pelo jumper USB power)"
katapult:
  comum:
    - "CONFIG_MCU_STM32F407=y"
    - "CONFIG_CLOCK_FREQ_180M=y"
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # porta CAN no RJ12 (v1/v1.1)
  usb:
    - "CONFIG_USB=y"
    - "CONFIG_USB_IDS=1d50:6177"             # VALIDAR
klipper:
  comum:
    - "CONFIG_MCU_STM32F407=y"
    - "CONFIG_CLOCK_FREQ_180M=y"
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"
  usb:
    - "CONFIG_USB=y"
hardware:
  resistor_120r: permanente
  avisos:
    - "A Octopus tem 4 variantes de MCU — confira o chip antes de flashear"
