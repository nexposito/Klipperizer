# BTT SB2209/SB2240 (STM32) — reference: canbus.esoterical.online (Common Toolhead Hardware)
name: "BTT SB2209/SB2240 (STM32)"
category: toolhead
mcu: STM32F072
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Set the 5V jumper, connect USB, hold RESET and BOOT, release RESET then BOOT (lsusb must show 0483:df11)"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: jumper
  warnings:
    - "5V jumper required to power via USB in DFU mode"
