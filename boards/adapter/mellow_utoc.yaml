# Mellow Fly UTOC-1 / UTOC-3 — adaptador USB-CAN (não roda Katapult/Klipper)
# Referência: canbus.esoterical.online (Common CAN Adapters)
# O firmware de fábrica já vem instalado; este perfil restaura o OEM.
nome: "Mellow Fly UTOC-1/UTOC-3"
categoria: adaptador
mcu: STM32/APM32

bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"    # variante STM32
    - "314b:0106"    # variante Geehy APM32
  instrucoes: "Coloque o jumper DFU e conecte o USB (lsusb mostra 0483:df11 OU 314b:0106)"

adaptador:
  firmware: "https://mellow-3d.github.io/files/utoc_firmware.bin"
  comando: "dfu-util -d {vidpid} -c 1 -i 0 -a 0 -s 0x08000000 -D {arquivo}"

hardware:
  resistor_120r: permanente
  avisos:
    - "O firmware de fábrica já vem instalado — só use para restauração"
