# BTT Eddy Duo — reference: canbus.esoterical.online (Common Toolhead Hardware)
name: "BTT Eddy Duo"
category: toolhead
mcu: RP2040
bootloader:
  method: bootsel
  vid_pid:
    - "2e8a:0003"
  instructions: "Move the USB/CAN switch to USB, hold BOOT and connect the USB cable"
katapult:
  common:
    - "CONFIG_MACH_RPXXXX=y"
    - "CONFIG_MACH_RP2040=y"
    - "CONFIG_RPXXXX_FLASH_START_4000=y"
  can:
    - "CONFIG_RPXXXX_CANBUS=y"
    - "CONFIG_RPXXXX_CANBUS_GPIO_RX=20"   # VERIFY pins
    - "CONFIG_RPXXXX_CANBUS_GPIO_TX=21"   # VERIFY pins
  usb:
    - "CONFIG_RPXXXX_USB=y"
klipper:
  common:
    - "CONFIG_MACH_RPXXXX=y"
    - "CONFIG_MACH_RP2040=y"
    - "CONFIG_RPXXXX_FLASH_START_4000=y"
  can:
    - "CONFIG_RPXXXX_CANBUS=y"
    - "CONFIG_RPXXXX_CANBUS_GPIO_RX=20"   # VERIFY pins
    - "CONFIG_RPXXXX_CANBUS_GPIO_TX=21"   # VERIFY pins
  usb:
    - "CONFIG_RPXXXX_USB=y"
hardware:
  resistor_120r: jumper
  warnings:
    - "Physical USB/CAN switch — move it back to CAN after flashing"
    - "VERIFY the CAN GPIO numbers against the guide before the first flash"
