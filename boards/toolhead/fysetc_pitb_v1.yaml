# Fysetc PITB V1.0 — referência: canbus.esoterical.online (Common Toolhead Hardware)
nome: "Fysetc PITB V1.0"
categoria: toolhead
mcu: STM32F072
bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"
  instrucoes: "Desconecte o cabo CAN, conecte o USB, segure BOOT SEL, toque RST, conte 5 e solte BOOT SEL"
katapult:
  comum:
    - "CONFIG_MCU_STM32F072=y"
    - "CONFIG_CLOCK_FREQ_48M=y"
    - "CONFIG_STM32_FLASH_START_8002000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
    - "CONFIG_USB_IDS=1d50:6177"             # VALIDAR
klipper:
  comum:
    - "CONFIG_MCU_STM32F072=y"
    - "CONFIG_CLOCK_FREQ_48M=y"
    - "CONFIG_STM32_FLASH_START_8002000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
hardware:
  resistor_120r: permanente
  avisos:
    - "120R permanente — não removível"
    - "Confirme MCU, offset e pinos no guia antes do primeiro flash"
