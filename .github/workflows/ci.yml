name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          wget -qO yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Validate board profiles
        run: |
          fail=0
          for f in boards/*/*.yaml; do
            name=$(yq eval '.name' "$f" 2>/dev/null || true)
            vids=$(yq eval '.bootloader.vid_pid | length' "$f" 2>/dev/null || echo 0)
            if [ -z "$name" ] || [ "$name" = "null" ] || [ "$vids" = "0" ]; then
              echo "::error file=$f::Invalid profile: needs 'name' and at least one 'bootloader.vid_pid'"
              fail=1
            else
              echo "OK: $f ($name)"
            fi
          done
          exit $fail

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck klipperizer install.sh uninstall.sh lib/*.sh
