# BTT Manta E3EZ — referência: canbus.esoterical.online (Common Mainboard Hardware)
nome: "BTT Manta E3EZ"
categoria: mainboard
mcu: STM32G0B1
bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"
  instrucoes: "Segure BOOT, toque RST, conte 5 e solte BOOT"
katapult:
  comum:
    - "CONFIG_MCU_STM32G0B1=y"
    - "CONFIG_CLOCK_FREQ_64M=y"
    - "CONFIG_STM32_FLASH_START_8002000=y"
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"
  usb:
    - "CONFIG_USB=y"
    - "CONFIG_USB_IDS=1d50:6177"             # VALIDAR
klipper:
  comum:
    - "CONFIG_MCU_STM32G0B1=y"
    - "CONFIG_CLOCK_FREQ_64M=y"
    - "CONFIG_STM32_FLASH_START_8002000=y"
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"
  usb:
    - "CONFIG_USB=y"
hardware:
  resistor_120r: jumper
  avisos: []
