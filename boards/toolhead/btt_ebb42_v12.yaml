# BTT EBB42 V1.2 — verified against the official BTT EBB README (same family as EBB36 V1.2)
# Katapult LED symbols renamed upstream: ENABLE_LED / STATUS_LED_PIN (verified in katapult master src/Kconfig)
name: "BTT EBB42 V1.2"
category: toolhead
mcu: STM32G0B1
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Set the 5V jumper, connect USB, hold RESET and BOOT, release RESET then BOOT (lsusb must show 0483:df11)"
# CAN on PB0/PB1 requires low-level options; clock reference defaults to the 8 MHz crystal (matches the board)
# Status LED on PA13 blinks once a second while the board sits in the Katapult bootloader
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
    - "CONFIG_ENABLE_LED=y"
    - 'CONFIG_STATUS_LED_PIN="PA13"'
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB0_PB1=y"
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB0_PB1=y"
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: jumper
  warnings:
    - "5V jumper required to power the board via USB in DFU mode"
