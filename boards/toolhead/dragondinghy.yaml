# DragonDinghy — referência: canbus.esoterical.online | docs: drachenkaetzchen.github.io/DragonDinghy
nome: "DragonDinghy"
categoria: toolhead
mcu: STM32F072
bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"
  instrucoes: "Alimente via 24V ou pelo jumper 5V USB, segure BOOT, toque RESET e solte BOOT (LED DFU acende)"
katapult:
  comum:
    - "CONFIG_MCU_STM32F072=y"
    - "CONFIG_CLOCK_FREQ_48M=y"
    - "CONFIG_STM32_FLASH_START_8002000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
    - "CONFIG_USB_IDS=1d50:6177"             # VALIDAR
klipper:
  comum:
    - "CONFIG_MCU_STM32F072=y"
    - "CONFIG_CLOCK_FREQ_48M=y"
    - "CONFIG_STM32_FLASH_START_8002000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
hardware:
  resistor_120r: jumper
  avisos:
    - "LED DFU indica o modo de gravação"
    - "Confirme MCU, offset e pinos no guia antes do primeiro flash"
