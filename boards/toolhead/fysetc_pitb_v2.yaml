# Fysetc PITB V2.0 — reference: canbus.esoterical.online (Common Toolhead Hardware)
# NOTE: without the CAN jumper the board enters CAN-FD (not supported by Klipper)
name: "Fysetc PITB V2.0"
category: expansion_board
mcu: STM32F072
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Disconnect the CAN cable, connect USB, hold BT0, tap RST, count 5 and release BT0"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: permanent
  warnings:
    - "CAN jumper mandatory — without it the board enters CAN-FD (unsupported)"
    - "120R permanent — not removable"
