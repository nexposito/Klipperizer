# BTT U2C v2.1 — USB-CAN adapter (does not run Katapult/Klipper)
# Reference: canbus.esoterical.online (Common CAN Adapters)
name: "BTT U2C v2.1"
category: adapter
mcu: STM32G0B1
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Hold the BOOT button while connecting the USB cable"
adapter:
  firmware: "https://github.com/Esoterical/voron_canbus/raw/main/can_adapter/BigTreeTech%20U2C%20v2.1/G0B1_U2C_V2.bin"
  command: "dfu-util -d {vidpid} -a 0 -s 0x08000000:leave -D {file}"
hardware:
  resistor_120r: jumper
  warnings:
    - "Requires the gs_usb kernel driver (lsmod | grep can)"
    - "Some batches shipped with faulty firmware — flashing the fixed binary resolves it"
