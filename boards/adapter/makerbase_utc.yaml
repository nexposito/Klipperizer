# Makerbase UTC 1.0 — USB-CAN adapter (does not run Katapult/Klipper)
# Reference: canbus.esoterical.online (Common CAN Adapters)
# NOTE: special case — from the factory nBOOT_SEL is locked and the BOOT
# button does not work. Recovery requires an STLink (STM32CubeProgrammer):
# 1. Connect the STLink to the SWD header (pin1=SWDIO, pin2=3.3V, pin3=SWCLK, pin4=GND, pin5=Reset)
# 2. In STM32CubeProgrammer, uncheck nBOOT_SEL in Option Bytes and apply
# 3. After that, DFU mode works normally
name: "Makerbase UTC 1.0"
category: adapter
mcu: STM32G0B1
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "FIRST TIME: STLink recovery (unlock nBOOT_SEL). Afterwards: hold BOOT while connecting USB"
adapter:
  firmware: "https://github.com/marckleinebudde/candleLight_fw"
  command: "VERIFY: the UTC uses CandleLight (local build) or Klipper USB-CAN-Bridge — see the guide"
hardware:
  resistor_120r: jumper
  warnings:
    - "From the factory nBOOT_SEL is locked — first recovery requires an STLink"
    - "Ships with Klipper USB-CAN-Bridge at 250k — bitrate cannot change without reflashing"
    - "Recommended alternative: CandleLight firmware (multichannel)"
