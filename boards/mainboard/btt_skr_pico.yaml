# BTT SKR Pico — reference: canbus.esoterical.online (Common Mainboard Hardware)
# NOTE: requires an external CAN transceiver (TJA1050) wired to IO0/IO1
name: "BTT SKR Pico"
category: mainboard
mcu: RP2040
bootloader:
  method: bootsel
  vid_pid:
    - "2e8a:0003"
  instructions: "VERIFY in the guide: SKR Pico BOOTSEL sequence"
katapult:
  common:
    - "CONFIG_MACH_RPXXXX=y"
    - "CONFIG_MACH_RP2040=y"
    - "CONFIG_RPXXXX_FLASH_START_4000=y"
  can:
    - "CONFIG_RPXXXX_CANBUS=y"
    - "CONFIG_RPXXXX_CANBUS_GPIO_RX=0"   # VERIFY pins (IO0/IO1)
    - "CONFIG_RPXXXX_CANBUS_GPIO_TX=1"   # VERIFY pins (IO0/IO1)
  usb:
    - "CONFIG_RPXXXX_USB=y"
klipper:
  common:
    - "CONFIG_MACH_RPXXXX=y"
    - "CONFIG_MACH_RP2040=y"
    - "CONFIG_RPXXXX_FLASH_START_4000=y"
  can:
    - "CONFIG_RPXXXX_CANBUS=y"
    - "CONFIG_RPXXXX_CANBUS_GPIO_RX=0"   # VERIFY pins (IO0/IO1)
    - "CONFIG_RPXXXX_CANBUS_GPIO_TX=1"   # VERIFY pins (IO0/IO1)
  usb:
    - "CONFIG_RPXXXX_USB=y"
hardware:
  resistor_120r: external
  warnings:
    - "Requires an external CAN transceiver (TJA1050) on IO0/IO1 — no CAN without it"
    - "The 120R resistor lives on the transceiver, not on the board"
