name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar-perfis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar yq
        run: |
          wget -qO yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Validar perfis de placas
        run: |
          falha=0
          for f in boards/*/*.yaml; do
            nome=$(yq eval '.nome' "$f" 2>/dev/null || true)
            vids=$(yq eval '.bootloader.vid_pid | length' "$f" 2>/dev/null || echo 0)
            if [ -z "$nome" ] || [ "$nome" = "null" ] || [ "$vids" = "0" ]; then
              echo "::error file=$f::Perfil inválido: precisa de 'nome' e ao menos um 'bootloader.vid_pid'"
              falha=1
            else
              echo "OK: $f ($nome)"
            fi
          done
          exit $falha

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck klipperizer install.sh uninstall.sh lib/*.sh
