# Fysetc Spider v3.0 H7 — referência: canbus.esoterical.online (Common Mainboard Hardware)
nome: "Fysetc Spider v3.0 H7"
categoria: mainboard
mcu: STM32H743
bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"
  instrucoes: "Segure BT0, toque RST, conte 5 e solte BT0"
katapult:
  comum:
    - "CONFIG_MCU_STM32H743=y"
    - "CONFIG_CLOCK_FREQ_480M=y"             # VALIDAR: clock no guia
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
    - "CONFIG_USB_IDS=1d50:6177"             # VALIDAR
klipper:
  comum:
    - "CONFIG_MCU_STM32H743=y"
    - "CONFIG_CLOCK_FREQ_480M=y"             # VALIDAR: clock no guia
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
hardware:
  resistor_120r: permanente
  avisos:
    - "Porta CAN em conector JST-XH"
    - "Confirme MCU, clock, offset e pinos no guia antes do primeiro flash"
