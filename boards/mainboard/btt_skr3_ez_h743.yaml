# BTT SKR-3 EZ (STM32H743) — referência: canbus.esoterical.online (Common Mainboard Hardware)
nome: "BTT SKR-3 EZ (STM32H743)"
categoria: mainboard
mcu: STM32H743
bootloader:
  metodo: dfu
  vid_pid:
    - "0483:df11"
  instrucoes: "VALIDAR no guia: sequência de DFU da SKR-3 EZ"
katapult:
  comum:
    - "CONFIG_MCU_STM32H743=y"
    - "CONFIG_CLOCK_FREQ_480M=y"             # VALIDAR: clock no guia
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
    - "CONFIG_USB_IDS=1d50:6177"             # VALIDAR
klipper:
  comum:
    - "CONFIG_MCU_STM32H743=y"
    - "CONFIG_CLOCK_FREQ_480M=y"             # VALIDAR: clock no guia
    - "CONFIG_STM32_FLASH_START_8008000=y"   # VALIDAR: offset
  can:
    - "CONFIG_CAN_BUS=y"
    - "CONFIG_CAN_BUS_PA11_PA12=y"           # VALIDAR: pinos
  usb:
    - "CONFIG_USB=y"
hardware:
  resistor_120r: permanente
  avisos:
    - "Alguns lotes vieram sem o resistor 120R soldado — confira"
    - "A SKR-3 EZ tem 2 variantes de MCU (H723/H743) — confira o chip"
