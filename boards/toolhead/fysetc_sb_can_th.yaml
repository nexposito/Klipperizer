# Fysetc SB-CAN-TH — reference: canbus.esoterical.online (Common Toolhead Hardware)
# v1.1 enters DFU by itself when powered; v1.3 requires holding reset for 2s
name: "Fysetc SB-CAN-TH"
category: toolhead
mcu: STM32F072
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "v1.1: power everything off, connect USB and power on (enters DFU by itself). v1.3: power on, wait for boot, hold the reset button for 2 seconds"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: none
  warnings:
    - "v1.1 has no 120R resistor or provisions; v1.3 has a 120R header"
    - "After flashing, power everything off, remove USB and connect CAN before powering on"
