# BTT EBB42 Gen2 — reference: canbus.esoterical.online (Common Toolhead Hardware)
name: "BTT EBB42 Gen2"
category: toolhead
mcu: STM32G0B1
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Connect the board to the breakout, remove the USB/CAN jumper, power the breakout via USB, hold BOOT, tap RST, count 5 and release BOOT"
# CAN on PB0/PB1 requires low-level options (same family as EBB36 V1.2 — VERIFY)
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB0_PB1=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_LOW_LEVEL_OPTIONS=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_MMENU_CANBUS_PB0_PB1=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: jumper
  warnings:
    - "The breakout is not a USB-CAN adapter — you need a U2C/UTOC or a mainboard in bridge mode"
    - "After DFU, put the USB/CAN jumper back for CAN operation"
