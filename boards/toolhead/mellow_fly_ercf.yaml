# Mellow Fly ERCF — reference: canbus.esoterical.online (Common Toolhead Hardware)
name: "Mellow Fly ERCF"
category: toolhead
mcu: RP2040
bootloader:
  method: bootsel
  vid_pid:
    - "2e8a:0003"
  instructions: "Disconnect USB and CAN, hold BOOT, connect USB keeping BOOT held, wait and release (lsusb shows Pi RP2 Boot)"
katapult:
  common:
    - "CONFIG_MACH_RPXXXX=y"
    - "CONFIG_MACH_RP2040=y"
    - "CONFIG_RPXXXX_FLASH_START_4000=y"
  can:
    - "CONFIG_RPXXXX_CANBUS=y"
    - "CONFIG_RPXXXX_CANBUS_GPIO_RX=25"   # VERIFY pins
    - "CONFIG_RPXXXX_CANBUS_GPIO_TX=26"   # VERIFY pins
  usb:
    - "CONFIG_RPXXXX_USB=y"
klipper:
  common:
    - "CONFIG_MACH_RPXXXX=y"
    - "CONFIG_MACH_RP2040=y"
    - "CONFIG_RPXXXX_FLASH_START_4000=y"
  can:
    - "CONFIG_RPXXXX_CANBUS=y"
    - "CONFIG_RPXXXX_CANBUS_GPIO_RX=25"   # VERIFY pins
    - "CONFIG_RPXXXX_CANBUS_GPIO_TX=26"   # VERIFY pins
  usb:
    - "CONFIG_RPXXXX_USB=y"
hardware:
  resistor_120r: permanent
  warnings:
    - "VERIFY the CAN GPIO numbers against the guide before the first flash"
