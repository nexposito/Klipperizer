# AFC-Pro — reference: canbus.esoterical.online | docs: github.com/xbst/AFC-Pro
name: "AFC-Pro"
category: toolhead
mcu: STM32F072
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Connect USB, hold BOOT, tap RESET, count 5 and release BOOT"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: jumper
  warnings:
    - "VERIFY MCU, offset and pins against the guide before the first flash"
