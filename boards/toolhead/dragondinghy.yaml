# DragonDinghy — reference: canbus.esoterical.online | docs: drachenkaetzchen.github.io/DragonDinghy
name: "DragonDinghy"
category: expansion_board
mcu: STM32F072
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Power via 24V or the 5V USB jumper, hold BOOT, tap RESET and release BOOT (DFU LED lights up)"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32F072=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: jumper
  warnings:
    - "DFU LED indicates flashing mode"
    - "VERIFY MCU, offset and pins against the guide before the first flash"
