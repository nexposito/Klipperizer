# BTT Manta E3EZ — reference: canbus.esoterical.online (Common Mainboard Hardware)
name: "BTT Manta E3EZ"
category: mainboard
mcu: STM32G0B1
bootloader:
  method: dfu
  vid_pid:
    - "0483:df11"
  instructions: "Hold BOOT, tap RST, count 5 and release BOOT"
katapult:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
    - "CONFIG_STM32_APP_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
klipper:
  common:
    - "CONFIG_MACH_STM32=y"
    - "CONFIG_MACH_STM32G0B1=y"
    - "CONFIG_STM32_FLASH_START_2000=y"
  can:
    - "CONFIG_STM32_CANBUS_PA11_PA12=y"   # VERIFY pins
  usb:
    - "CONFIG_STM32_USB_PA11_PA12=y"
hardware:
  resistor_120r: jumper
  warnings: []
